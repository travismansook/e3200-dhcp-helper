name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Configuration, scope and diagnostic tests
        run: python -m unittest discover -s tests -v
      - name: Check Unix shell syntax
        if: runner.os != 'Windows'
        run: |
          for script in unix/*.sh unix/*.command; do
            [ -f "$script" ] || continue
            bash -n "$script" || exit 1
          done

  powershell:
    name: Windows offline checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse and test without starting a server
        shell: powershell
        run: ./windows/Test-Helper.ps1
      - name: Test modern PowerShell compatibility
        shell: pwsh
        run: ./windows/Test-Helper.ps1

  dnsmasq:
    name: dnsmasq parser check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install parser only
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base
      - name: Render a synthetic configuration and syntax check it
        run: |
          python -c "import json,pathlib,e3200_helper as h; c=json.loads(pathlib.Path('config.example.json').read_text()); c['interface']='eth0'; print(h.render_dnsmasq(c))" | /usr/sbin/dnsmasq --test --conf-file=-
